name: Hardware lab

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: esp32qjs-hardware-lab
  cancel-in-progress: false

jobs:
  device-regression:
    name: Device regression
    runs-on: [self-hosted, esp32qjs-hardware-lab]
    timeout-minutes: 180
    environment: hardware-lab
    steps:
      - name: Check out recursive repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Sync locked tooling environment
        run: uv sync --locked
      - name: Record CSI qualification context
        env:
          ESP32QJS_CSI_ROUTER_LABEL: ${{ vars.CSI_ROUTER_LABEL }}
          ESP32QJS_CSI_PEER_LABEL: ${{ vars.CSI_PEER_LABEL }}
          ESP32QJS_CSI_CHANNEL_BAND: ${{ vars.CSI_CHANNEL_BAND }}
        run: >-
          uv run python scripts/hardware_lab_evidence.py
          --build-context "${{ vars.BUILD_CONTEXT }}"
          --transport-target "${{ vars.TARGET }}"
          --router-label "${ESP32QJS_CSI_ROUTER_LABEL}"
          --peer-label "${ESP32QJS_CSI_PEER_LABEL}"
          --channel-band "${ESP32QJS_CSI_CHANNEL_BAND}"
          --test-command "TEST_JS_CONFIG='{\"csiSoakDurationMs\":3600000}' uv run python scripts/remote.py --build-context <recorded> --target <recorded> test --scope js --network --loopback --media-hardware --wireless-hardware --csi-hardware --csi-soak"
          --output build/hardware-lab/csi-context.json
      - name: Run device JavaScript regression suite
        env:
          TEST_WIFI_SSID: ${{ secrets.TEST_WIFI_SSID }}
          TEST_WIFI_PASSWORD: ${{ secrets.TEST_WIFI_PASSWORD }}
          TEST_HTTP_URL: ${{ vars.TEST_HTTP_URL }}
          TEST_JS_CONFIG: '{"csiSoakDurationMs":3600000}'
        run: |
          set -o pipefail
          uv run python scripts/remote.py \
            --build-context "${{ vars.BUILD_CONTEXT }}" \
            --target "${{ vars.TARGET }}" \
            test --scope js --network --loopback --media-hardware --wireless-hardware --csi-hardware --csi-soak |
            tee build/hardware-lab/csi-test.log
